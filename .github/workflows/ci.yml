name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Build/typecheck don't hit the DB, but lib/env.ts validates these at import.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
  AUTH_SECRET: ci-secret-at-least-16-characters-long
  NEXTAUTH_SECRET: ci-secret-at-least-16-characters-long
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: primedesk
          POSTGRES_PASSWORD: password
          POSTGRES_DB: primedesk_crm
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://primedesk:password@localhost:5432/primedesk_crm
      DIRECT_URL: postgresql://primedesk:password@localhost:5432/primedesk_crm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test
